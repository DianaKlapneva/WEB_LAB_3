<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Веб-версия игры 2048">
    <title>2048</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="icon" type="image/png" href="my_game.png">
</head>
<body>
    <script src="game_mechanics.js" ></script> 
    <div class="container">  
        <h1>2048</h1>     
        <div class="score-container">
            <div>Очки: <span id="score">0</span></div>
        </div>
        
        <div class="game-container">
            <div class="grid-container">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>

                

        <div class="game-over-container" id="game-over">
                <div class="game-over-message" id="game-over-message">Игра окончена! Введите ваше имя:</div>
                <input type="text" id="player-name" class="name-input" maxlength="20">
                <div class="game-over-buttons">
                    <button id="save-score-btn" class="save-btn">Сохранить результат</button>
                    <button id="new-game-btn" class="restart-btn">Начать заново</button>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button id="restart-btn">Новая игра</button>
            <button id="undo-btn">Отменить ход</button>
        </div>
        
        <div class="mobile-controls" id="mobile-controls">
            <button class="control-btn control-up" data-direction="up">↑</button>
            <button class="control-btn control-left" data-direction="left">←</button>
            <button class="control-btn control-down" data-direction="down">↓</button>
            <button class="control-btn control-right" data-direction="right">→</button>
        </div>

        <a href="leaderboard.html" class="leaderboard-link">Таблица лидеров</a>
    </div>  
</body>
</html>
